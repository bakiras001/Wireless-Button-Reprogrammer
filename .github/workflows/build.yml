name: Build WBR

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: windows-latest   # WPF needs the Windows Desktop SDK, so this must run on Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WBR/WBR.csproj

      - name: Build (Release)
        run: dotnet build WBR/WBR.csproj --configuration Release --no-restore

      - name: Upload built exe
        uses: actions/upload-artifact@v4
        with:
          name: WBR-build
          path: WBR/bin/Release/net8.0-windows/**
          if-no-files-found: error
